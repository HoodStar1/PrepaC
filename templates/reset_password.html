{% extends "base.html" %}
{% block title %}Reset password · PrepaC{% endblock %}
{% block page_label %}Account recovery{% endblock %}
{% block content %}
<div class="auth-shell">
  <section class="card auth-card" aria-labelledby="reset-title">
    <h1 id="reset-title">Reset password</h1>
    <p>Enter your local account and recovery secret to choose a new password.</p>
    <form method="post" action="{{ url_for('reset_password_page') }}" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="reset-username"><span>Username</span><input id="reset-username" type="text" name="username" autocomplete="username" required></label>
      <label for="recovery-secret"><span>Recovery secret</span><input id="recovery-secret" type="password" name="recovery_secret" autocomplete="off" required></label>
      <label for="new-password"><span>New password</span><input id="new-password" type="password" name="new_password" autocomplete="new-password" minlength="8" required></label>
      <label for="confirm-password"><span>Confirm password</span><input id="confirm-password" type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label>
      <div class="actions">
        <button type="submit">Reset password</button>
        <a class="button ghost" href="{{ url_for('login_page') }}">Back to sign in</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
