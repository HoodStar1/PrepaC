[build-system]
requires = [
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "PrepaC"
dynamic = ["version"]
description = "Self-hosted preparation, packing, posting, sharing, and cleanup workflows"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "Flask==3.1.3",
  "requests==2.34.2",
  "Pillow==12.3.0",
  "gunicorn==26.0.0; platform_system == 'Linux'",
  "waitress==3.0.2; platform_system == 'Windows'",
  "watchdog==6.0.0",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
build = [
  "Cython==3.2.8",
]

[project.scripts]
prepac = "prepac:main"

[tool.setuptools]
packages = ["app"]
py-modules = ["prepac"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "app.version.APP_VERSION"}

[tool.setuptools.data-files]
"share/prepac/templates" = ["templates/*.html"]
"share/prepac/static" = ["static/*.css"]
"share/prepac/static/js" = ["static/js/*.js"]
