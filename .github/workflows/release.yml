name: Release PrepaC

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Verify version and create release files
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          import zipfile
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"Invalid release tag: {tag}")
          version = tag[1:]

          version_text = Path("app/version.py").read_text(encoding="utf-8")
          match = re.search(r'^APP_VERSION\s*=\s*"([^"]+)"', version_text, re.MULTILINE)
          if not match or match.group(1) != version:
              raise SystemExit("The tag does not match app/version.py")

          package = json.loads(Path("package.json").read_text(encoding="utf-8"))
          lock = json.loads(Path("package-lock.json").read_text(encoding="utf-8"))
          lock_root = lock.get("packages", {}).get("", {})
          if (
              package.get("version") != version
              or lock.get("version") != version
              or lock_root.get("version") != version
          ):
              raise SystemExit("The tag does not match the Node package files")

          archive_name = f"PrepaC-v{version}.zip"
          prefix = f"PrepaC-v{version}/"
          excluded_directories = {
              ".git", ".github", ".pytest_cache", ".ruff_cache", ".venv",
              "__pycache__", "backups", "build", "config", "dist", "env",
              "GITHUB UPLOAD", "tests", "venv",
          }
          excluded_names = {
              ".env", "docker-compose.yml", archive_name,
              archive_name + ".sha256",
          }
          excluded_suffixes = {
              ".db", ".key", ".p12", ".pem", ".pfx", ".pyc", ".pyo",
              ".sqlite", ".sqlite3",
          }

          required = {
              "Dockerfile", "LICENSE", "README.md", "app/version.py",
              "docker-compose.example.yml", "requirements-linux.txt",
              "requirements-windows.txt",
          }
          included = set()

          with zipfile.ZipFile(archive_name, "w", zipfile.ZIP_DEFLATED) as output:
              for path in sorted(Path(".").rglob("*")):
                  if path.is_dir():
                      continue
                  relative = path.as_posix()
                  if any(part in excluded_directories for part in path.parts):
                      continue
                  if (
                      path.name in excluded_names
                      or path.name.startswith(".env.")
                      or path.suffix.lower() in excluded_suffixes
                  ):
                      continue
                  mode = path.lstat().st_mode
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Links are not allowed in releases: {relative}")
                  output.write(path, prefix + relative)
                  included.add(relative)

          missing = required - included
          if missing:
              raise SystemExit(f"Release is missing required files: {sorted(missing)}")

          digest = hashlib.sha256(Path(archive_name).read_bytes()).hexdigest()
          checksum_name = archive_name + ".sha256"
          Path(checksum_name).write_text(
              f"{digest}  {archive_name}\n",
              encoding="ascii",
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"archive={archive_name}\n")
              output.write(f"checksum={checksum_name}\n")
          PY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: PrepaC v${{ steps.release.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.checksum }}
